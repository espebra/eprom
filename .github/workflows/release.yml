name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="eprom-${VERSION}-${os}-${arch}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "build/${name}/eprom${ext}" .
            cp LICENSE README.md "build/${name}/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -C build -czf "dist/${name}.tar.gz" "${name}"
            fi
          done
          cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes --verify-tag
